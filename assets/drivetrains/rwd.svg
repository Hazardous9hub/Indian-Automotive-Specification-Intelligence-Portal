<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Chassis Frame -->
  <line x1="24" y1="12" x2="24" y2="36" stroke="#64748b" stroke-width="3" stroke-dasharray="2 3"/>
  <line x1="12" y1="14" x2="36" y2="14" stroke="#475569" stroke-width="2.5"/>
  <line x1="12" y1="34" x2="36" y2="34" stroke="#f59e0b" stroke-width="3.5"/>
  <!-- Front Wheels (Unpowered Slate) -->
  <rect x="7" y="9" width="6" height="10" rx="2" fill="#475569"/>
  <rect x="35" y="9" width="6" height="10" rx="2" fill="#475569"/>
  <!-- Rear Wheels (Powered Amber) -->
  <rect x="7" y="29" width="6" height="10" rx="2" fill="#f59e0b"/>
  <rect x="35" y="29" width="6" height="10" rx="2" fill="#f59e0b"/>
  <!-- Rear Differential Indicator -->
  <circle cx="24" cy="34" r="3.5" fill="#f59e0b"/>
</svg>